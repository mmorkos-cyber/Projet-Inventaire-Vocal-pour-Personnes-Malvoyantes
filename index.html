<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inventaire vocal</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <h2>Inventaire Vocal</h2>

  <input type="file" id="upload" accept="image/*">

  <div id="image-container">
    <div class="canvas-wrapper">
      <img id="image" alt="Aperçu image">
      <canvas id="canvas" style="position:absolute; top:0; left:0; pointer-events:none; width: 100%; height: 100%;"></canvas>
    </div>
  </div>

  <div class="button-group">
    <button id = "analyse_btn"><b>ANALYSER</b></button>
  <button id = "stop_tts"><b>STOP</b></button>
  <button id = "pause_tts"><b>PAUSE</b></button>
  <button id = "reprendre_tts"><b>REPRENDRE</b></button>
  </div>
    <h2></h2>
    <ul id="listInventaire">
    </ul>
  </div>
 
 

</body>

<script type ="text/javascript" src="script.js"></script>
<!-- Import TensorFlow.js library -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/dist/tf.min.js" type="text/javascript"></script>
<!-- Load the coco-ssd model to use to recognize things in images -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</html>
